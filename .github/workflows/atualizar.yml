name: Atualizar Addon Stremio

on:
  schedule:
    # Roda automaticamente todo dia à meia-noite (horário UTC)
    - cron: "0 0 * * *"
  # Permite rodar manualmente a qualquer momento na aba Actions
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Dá permissão para o robô fazer commits e enviar alterações para o repositório

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Executar script de atualização
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python gerar_addon.py

      - name: Salvar alterações no GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Automated update of catalog and streams"
          git push
