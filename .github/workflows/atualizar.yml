name: Atualizar Addon Stremio

on:
  schedule:
    # Roda automaticamente todo dia à meia-noite UTC
    - cron: '0 0 * * *'
  # Permite rodar manualmente na aba Actions
  workflow_dispatch:
  # Regera quando o gerador, workflow ou mapa de identificações mudar.
  push:
    paths:
      - 'gerar_addon.py'
      - '.github/workflows/atualizar.yml'
      - '.cache/series_identifications.json'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Baixar codigo do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Executar script de atualização
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python gerar_addon.py

      - name: Salvar alterações no GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Automated update of catalog and streams"
            git pull --rebase origin main
            git push
          else
            echo "Nenhuma alteração para commitar."
          fi
